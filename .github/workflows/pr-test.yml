on:
  pull_request:
    branches: [ master ]

jobs:
  pr-test:
    runs-on: ${{ matrix.os.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        os: 
          - runs-on: windows-latest
            arch: win-x64
          - runs-on: macos-latest
            arch: osx-arm64
          - runs-on: ubuntu-latest
            arch: linux-x64

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: restore
      run: dotnet restore OpenUtau -r ${{ matrix.os.arch }}

    - name: test
      run: dotnet run --project OpenUtau.Test/OpenUtau.Test.csproj
      timeout-minutes: 30

    # Headless UI tests of the whole app. A separate process: launching the app changes
    # process-wide state that the tests above rely on.
    - name: ui test
      run: dotnet run --project OpenUtau.UiTest/OpenUtau.UiTest.csproj
      timeout-minutes: 15

    # The release layout without the voicebank: the app published, the command line added next to it, and run from there.
    - name: package check
      shell: bash
      timeout-minutes: 20
      run: |
        dotnet publish OpenUtau -c Release -r ${{ matrix.os.arch }} --self-contained true -o bin/pack
        scripts/add-cli.sh ${{ matrix.os.arch }} bin/pack
        bin/pack/OpenUtau.Cli help > cli-check.json
        bin/pack/OpenUtau.Cli phonemizers >> cli-check.json
        head -c 400 cli-check.json
        cli=bin/pack/OpenUtau.Cli; if [ -f "$cli.exe" ]; then cli="$cli.exe"; fi
        echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' | node OpenUtau.Cli/mcpb/server/launcher.js "--cli=$cli" > mcpb-check.json
        grep -q openutau-chiaki mcpb-check.json

    - name: upload ui screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-screenshots-${{ matrix.os.arch }}
        path: OpenUtau.UiTest/bin/**/ui-screenshots/
        if-no-files-found: ignore
